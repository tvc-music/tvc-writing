backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Posts"
    folder: "_posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title",     name: "title",     widget: "string" }
      - { label: "Date",      name: "date",       widget: "datetime", format: "YYYY-MM-DD" }
      - label: "Type"
        name: "type"
        widget: "select"
        options: ["Essay", "Note"]
        default: "Essay"
      - { label: "Read Time", name: "read_time",  widget: "string", hint: "e.g. 8 min read", required: false }
      - { label: "Body",      name: "body",       widget: "markdown" }
